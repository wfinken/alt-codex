name: Bug report
description: Something in alt-codex isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `alt-codex`
        2. Press 'a' to add a profile
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: alt-codex version
      description: Output of `alt-codex --version`
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      render: shell
