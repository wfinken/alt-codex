name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Check if gh-pages branch exists
        id: ghpages
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}.git" gh-pages >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out gh-pages branch
        if: steps.ghpages.outputs.exists == 'true'
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Initialize gh-pages branch
        if: steps.ghpages.outputs.exists == 'false'
        run: |
          mkdir -p gh-pages
          cd gh-pages
          git init -b gh-pages
          git remote add origin "https://github.com/${{ github.repository }}.git"

      - name: Install apt repository tooling
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils

      - name: Import APT signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "APT_GPG_FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')" >> "$GITHUB_ENV"

      - name: Build apt repository
        run: |
          set -euo pipefail
          mkdir -p gh-pages/apt
          cp dist/*.deb gh-pages/apt/
          cd gh-pages/apt
          dpkg-scanpackages --multiversion . > Packages
          gzip -9fk Packages
          cat > release.conf <<EOF
          APT::FTPArchive::Release::Origin "alt-codex";
          APT::FTPArchive::Release::Label "alt-codex";
          APT::FTPArchive::Release::Suite "stable";
          APT::FTPArchive::Release::Codename "stable";
          APT::FTPArchive::Release::Architectures "amd64 arm64";
          EOF
          apt-ftparchive -c release.conf release . > Release
          rm release.conf
          gpg --batch --yes --default-key "$APT_GPG_FPR" --clearsign -o InRelease Release
          gpg --batch --yes --default-key "$APT_GPG_FPR" -abs -o Release.gpg Release
          gpg --armor --export "$APT_GPG_FPR" > gpg.key

      - name: Publish apt repository
        working-directory: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apt
          git commit -m "Publish apt packages for ${{ github.ref_name }}" || echo "Nothing to commit"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin gh-pages
